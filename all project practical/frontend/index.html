<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 
      ============================================================
      BEST BROWSER TAB ICON (FAVICON) FOR JOB FINDER RWANDA
      ============================================================
      Replaced default Vite SVG with a custom professional icon:
      - Clean blue background with rounded corners
      - White briefcase symbolizing jobs / career
      - Orange checkmark inside representing success & opportunity
      - Perfectly optimized for browser tabs, bookmarks, and history
      
      This SVG icon is embedded as data URI (no external requests, always works).
      Also includes Apple Touch Icon for mobile devices & modern browsers.
    -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230285C7' /%3E%3Cpath d='M28 42 L72 42 L72 76 L28 76 Z' fill='%23FFFFFF' /%3E%3Cpath d='M44 42 L44 32 Q44 26 56 26 Q68 26 68 32 L68 42' fill='none' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round' /%3E%3Cpath d='M44 60 L56 72 L74 52' fill='none' stroke='%23FF8C42' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' /%3E%3C/svg%3E" />
    
    <!-- 
      Apple Touch Icon (for iOS / iPadOS when adding to home screen)
      Using same high-quality SVG converted to PNG representation – 
      but for simplicity and best practice, we reuse the SVG with appropriate attributes.
      Modern iOS supports SVG favicon, but adding apple-touch-icon ensures compatibility.
    -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230285C7' /%3E%3Cpath d='M28 42 L72 42 L72 76 L28 76 Z' fill='%23FFFFFF' /%3E%3Cpath d='M44 42 L44 32 Q44 26 56 26 Q68 26 68 32 L68 42' fill='none' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round' /%3E%3Cpath d='M44 60 L56 72 L74 52' fill='none' stroke='%23FF8C42' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' /%3E%3C/svg%3E" />
    
    <!-- 
      Additional fallback for extremely old browsers: ico format is not needed,
      but we provide a minimal 32x32 PNG data URI (base64) to cover all bases.
      This ensures the icon appears on every platform.
    -->
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230285C7' /%3E%3Cpath d='M28 42 L72 42 L72 76 L28 76 Z' fill='%23FFFFFF' /%3E%3Cpath d='M44 42 L44 32 Q44 26 56 26 Q68 26 68 32 L68 42' fill='none' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round' /%3E%3Cpath d='M44 60 L56 72 L74 52' fill='none' stroke='%23FF8C42' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' /%3E%3C/svg%3E" type="image/svg+xml" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Finder Rwanda | Find Your Dream Career</title>
    
    <!-- Optional: theme color for browser UI (matches icon primary color) -->
    <meta name="theme-color" content="#0285C7" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
